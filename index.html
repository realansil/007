  const aspect = window.innerWidth / Math.max(window.innerHeight, 1);

const assembly = new THREE.Group();
scene.add(assembly);

/* ───────────── logo contours (traced from the reference image) ───────────── */

], [-2.0362, -1.1656], [-2.0576, -0.9666], [-2.0362, -0.7534], [-1.9225, -0.3696], [-1.8941, -0.3198], [-1.752, 0.1066], [-1.7235, 0.1493], [-1.7235, 0.1848], [-1.489, 0.7036], [-1.29, 1.0377], [-1.226, 1.1158], [-1.0981, 1.2296], [-1.0341, 1.258]]]}, {"area": 65320, "outer": [[2.2281, 1.5423], [0.1315, 1.5423], [0.0533, 1.4072], [-0.0675, 1.123], [-0.2026, 0.7107], [-0.1955, 0.6752], [0.2381, 0.6823], [0.4513, 1.1301], [1.3966, 1.1301], [1.4108, 1.0732], [1.29, 0.8316], [1.0981, 0.5544], [0.3589, -0.3412], [0.1315, -0.661], [-0.0746, -1.0306], [-0.2026, -1.3362], [-0.2452, -1.5139], [0.5437, -1.521], [0.5721, -1.4996], [0.6361, -1.2935], [0.7214, -1.1016], [0.9417, -0.7107], [1.1763, -0.3767], [1.7804, 0.3696], [2.022, 0.7534], [2.1144, 0.9453], [2.1997, 1.2011], [2.2281, 1.3646]], "holes": []}, {"area": 16402, "outer": [[1.489, -0.2772], [2.3419, -0.2772], [2.5267, -0.263], [2.6262, -0.2274], [2.747, -0.1493], [2.8252, -0.0498], [3.1663, 0.5046], [3.3085, 0.5899], [3.4932, 0.6183], [3.5501, 0.6468], [3.678, 0.7463], [3.6994, 0.7818], [3.6923, 0.8031], [2.2139, 0.8031], [2.1784, 0.7676], [2.1215, 0.6183], [2.1215, 0.398], [2.2139, 0.2203], [2.3205, 0.1279], [2.3561, 0.135], [2.3205, 0.3127], [2.3419, 0.4193], [2.3845, 0.5046], [2.8323, 0.5046], [2.8465, 0.4904], [2.7683, 0.2914], [2.6475, 0.064], [2.548, -0.0426], [2.3987, -0.1066], [1.6098, -0.1066], [1.489, -0.2345]], "holes": []}, {"area": 28498, "outer": [[2.2708, 0.9524], [2.2779, 0.9311], [3.8131, 0.9311], [3.9055, 1.0306], [4.0121, 1.0803], [4.7797, 1.0803], [4.9005, 1.1869], [4.9574, 1.2722], [5.0, 1.4001], [4.9929, 1.5423], [2.42, 1.5494], [2.4058, 1.5423], [2.3774, 1.2367], [2.349, 1.1158]], "holes": []}];


/* ───────────── materials ───────────── */
const matWhite = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.3, metalness: 0.0, clearcoat: 1, clearcoatRoughness: 0.12 });
const matSatin = new THREE.MeshPhysicalMaterial({ color: 0xf2f2f2, roughness: 0.42, metalness: 0.05, clearcoat: 0.5, clearcoatRoughness: 0.3 });
const matCut   = new THREE.MeshPhysicalMaterial({ color: 0xdfe3ea, roughness: 0.22, metalness: 0.1, clearcoat: 1, clearcoatRoughness: 0.08 });
const matVoid  = new THREE.MeshStandardMaterial({ color: 0x050507, roughness: 0.25, metalness: 0.85 });

/* ───────────── 2D geometry helpers ───────────── */
function chaikin(pts, iters) {
  let p = pts;
  for (let k = 0; k < iters; k++) {
    const out = [];
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[(i + 1) % p.length];
      out.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25],
               [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
    }
    p = out;
  }
  return p;
}
function ringArea(r) {
  let a = 0;
  for (let i = 0; i < r.length; i++) { const p = r[i], q = r[(i + 1) % r.length]; a += p[0] * q[1] - q[0] * p[1]; }
  return a / 2;
}
function pointInRing(x, y, r) {
  let inside = false;
  for (let i = 0, j = r.length - 1; i < r.length; j = i++) {
    const xi = r[i][0], yi = r[i][1], xj = r[j][0], yj = r[j][1];
    if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function pointInPart(x, y, outer, holes) {
  if (!pointInRing(x, y, outer)) return false;
  for (const h of holes) if (pointInRing(x, y, h)) return false;
  return true;

// Sutherland–Hodgman clip against the half-plane n·p <= c
function clipHalfPlane(poly, nx, ny, c) {
  const out = [];

    const a = poly[i], b = poly[(i + 1) % poly.length];
    const da = nx * a[0] + ny * a[1] - c, db = nx * b[0] + ny * b[1] - c;
    if (da <= 0) out.push(a);
    if ((da < 0 && db > 0) || (da > 0 && db < 0)) {
      const t = da / (da - db);
      out.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);

  return out;

    bevelSegments: bevSegs, curveSegments: 1, steps: 1,

  geo.translate(-c.x, -c.y, -c.z);

/* ───────────── fracture: Voronoi cells ∩ part outline ───────────── */
function fracturePart(prep) {

  const n = clamp(Math.round(area / 0.3), 5, 20);

  for (const p of outer) { minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]); minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]); }

  const seeds = [];

    if (tries % 400 === 399) minD *= 0.85;
    const x = rnd(minX, maxX), y = rnd(minY, maxY);
    if (!pointInPart(x, y, outer, holes)) continue;
    if (seeds.every((s) => Math.hypot(s[0] - x, s[1] - y) >= minD)) seeds.push([x, y]);
  }
  if (seeds.length < 2) return [];

  const box = [[minX - 1, minY - 1], [maxX + 1, minY - 1], [maxX + 1, maxY + 1], [minX - 1, maxY + 1]];
  const pieces = [];
  for (let i = 0; i < seeds.length; i++) {
    let cell = box;
    const si = seeds[i];
    for (let j = 0; j < seeds.length && cell.length > 2; j++) {
      if (j === i) continue;
      const sj = seeds[j];

      cell = clipHalfPlane(cell, nx, ny, c);

    try { res = polyClip.intersection([outer, ...holes], [cell]); } catch (e) { continue; }
    for (const poly of res) {
      const ring = poly[0].slice(0, -1);
      if (ring.length < 3 || Math.abs(ringArea(ring)) < 0.02) continue;
      pieces.push({ outer: ring, holes: poly.slice(1).map((h) => h.slice(0, -1)) });

/* ───────────── entities (anything that can fly off) ───────────── */
const parts = [];
const entities = [];
const debris = new THREE.Group();   // world-space parent while flying

function makeEntity(geo, mat, part, kind, opts = {}) {

  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.position.copy(centre);
  if (opts.quat) mesh.quaternion.copy(opts.quat);
  assembly.add(mesh);
  const e = {
    mesh, part, kind, mat,
    restPos: mesh.position.clone(), restQuat: mesh.quaternion.clone(),
    state: 'rest',               // rest | flying | settled | returning
    vel: new THREE.Vector3(), ang: new THREE.Vector3(),
    radius: geo.boundingSphere.radius,
    delay: 0, t: 0, sleep: 0,
    fromPos: new THREE.Vector3(), fromQuat: new THREE.Quaternion(), dur: 1,
  };
  mesh.userData.entity = e;
  entities.push(e);
  return e;
}

function makeSimplePart(name, geo, mat, pos, quat) {
  const part = { name, whole: null, pieces: [], fractured: false };
  const e = makeEntity(geo, mat, part, 'detail');
  if (pos) { e.mesh.position.add(pos); e.restPos.copy(e.mesh.position); }
  if (quat) { e.mesh.quaternion.copy(quat); e.restQuat.copy(quat); }
  part.whole = e;
  parts.push(part);
  return part;
}

async function buildLogo() {
  // 1. the five main parts, each as one crisp solid + a hidden set of pre-cut fragments
  for (let i = 0; i < PREP.length; i++) {
    const pr = PREP[i], c = pr.cfg;
    const part = { name: c.name, whole: null, pieces: [], fractured: false };
    part.whole = makeEntity(extrudeRings(pr.outer, pr.holes, c.depth, c.bevT, 5, 0.6), c.mat, part, 'whole');
    parts.push(part);

    for (const f of fracturePart(pr)) {
      let g;
      try { g = extrudeRings(f.outer, f.holes, c.depth, c.bevT * 0.6, 2, 0.5); } catch (e) { continue; }
      const e = makeEntity(g, c.mat === matSatin ? matSatin : matCut, part, 'piece');
      e.mesh.visible = false;
      part.pieces.push(e);
    }
    elLoading.textContent = 'assembling ' + Math.round(((i + 1) / PREP.length) * 80) + '%';
    await nextFrame();
  }

  // 2. mechanical details on the slide (all measured from the slide outline)
  const sp = LOGO_PARTS[4].outer;
  let topY = -1e9, tipX = -1e9;
  for (const [x, y] of sp) { topY = Math.max(topY, y); tipX = Math.max(tipX, x); }
  const slideCfg = PART_CFG[4];
  const faceZ = slideCfg.depth / 2 + slideCfg.bevT;          // 0.335

  // rear serrations: taller than the slide is thick so they stand proud on both faces
  for (let i = 0; i < 6; i++) {
    makeSimplePart('rib' + i, new RoundedBoxGeometry(0.034, 0.4, faceZ * 2 + 0.07, 2, 0.012), matWhite,
      new THREE.Vector3(2.5 + i * 0.075, topY - 0.34, 0).sub(new THREE.Vector3(0, 0, 0)));
  }
  // ejection port: bezel + dark window, on both faces
  for (const s of [1, -1]) {
    const bez = makeSimplePart('bezel' + s, new RoundedBoxGeometry(0.7, 0.27, 0.014, 2, 0.006), matSatin,
      new THREE.Vector3(3.55, topY - 0.3, s * (faceZ + 0.006)));
    const win = makeSimplePart('window' + s, new RoundedBoxGeometry(0.58, 0.17, 0.008, 2, 0.003), matVoid,
      new THREE.Vector3(3.55, topY - 0.3, s * (faceZ + 0.0125)));
  }
  // sights
  makeSimplePart('frontSight', new RoundedBoxGeometry(0.13, 0.11, 0.09, 2, 0.02), matWhite, new THREE.Vector3(tipX - 0.2, topY + 0.045, 0));
  for (const s of [1, -1]) {
    makeSimplePart('rearSight' + s, new RoundedBoxGeometry(0.09, 0.1, 0.08, 2, 0.015), matWhite, new THREE.Vector3(2.7, topY + 0.045, s * 0.1));
  }
  // muzzle crown + bore
  const crown = new THREE.CylinderGeometry(0.13, 0.13, 0.12, 32); crown.rotateZ(Math.PI / 2);
  makeSimplePart('muzzle', crown, matSatin, new THREE.Vector3(tipX + 0.0, topY - 0.22, 0));
  const bore = new THREE.CylinderGeometry(0.06, 0.06, 0.15, 24); bore.rotateZ(Math.PI / 2);
  makeSimplePart('bore', bore, matVoid, new THREE.Vector3(tipX + 0.02, topY - 0.22, 0));

  elLoading.textContent = 'assembling 100%';
}

/* ───────────── destruction & rebuild logic ───────────── */
const BLAST_R = 1.3;

let brokenCount = 0;
const fx = { shake: 0, pulse: 0 };       // filled in below (visual effects)

function isPickable(e) { return e.state === 'rest' && e.mesh.visible; }

function activateFracture(part) {
  part.fractured = true;
  part.whole.mesh.visible = false;
  for (const p of part.pieces) p.mesh.visible = true;
}

function launch(e, hitLocal, strength) {
  // world position of the piece before reparenting
  e.mesh.getWorldPosition(_w);
  debris.attach(e.mesh);
  assembly.localToWorld(_v.copy(hitLocal));
  const dir = _w.clone().sub(_v);
  const d = dir.length();
  if (d < 0.05) dir.set(rnd(-1, 1), rnd(-0.3, 1), rnd(0, 1));
  dir.normalize();
  const falloff = clamp(1.35 - d * 0.4, 0.45, 1.35) * strength;
  const speed = rnd(3.2, 7.2) * falloff;
  e.vel.copy(dir).multiplyScalar(speed);
  e.vel.y += rnd(1.5, 4.2);
  e.vel.z += rnd(0.5, 3.2);                 // bias toward the viewer so it reads in 3D
  e.ang.set(rnd(-9, 9), rnd(-9, 9), rnd(-9, 9)).multiplyScalar(1 / (0.6 + e.radius * 0.5));
  e.state = 'flying';
  e.sleep = 0;
  brokenCount++;
  integrityDirty = true;
}

/** Break everything near `worldPoint`. Returns how many entities came loose. */
function blastAt(worldPoint, hitEntity, strength = 1) {
  const hit = assembly.worldToLocal(worldPoint.clone());
  let loose = 0;
  const box = new THREE.Box3();

  for (const part of parts) {
    if (part.pieces.length) {
      // fracture the part the first time anything reaches it
      if (!part.fractured) {
        if (!part.whole.mesh.visible || part.whole.state !== 'rest') continue;
        box.copy(part.whole.mesh.geometry.boundingBox).translate(part.whole.restPos);
        if (box.distanceToPoint(hit) > BLAST_R && part.whole !== hitEntity) continue;
        activateFracture(part);
      }
      let nearest = null, nearestD = 1e9, got = 0;
      for (const p of part.pieces) {
        if (p.state !== 'rest') continue;
        const d = Math.max(0, p.restPos.distanceTo(hit) - p.radius * 0.6);
        if (d < nearestD) { nearestD = d; nearest = p; }
        if (d <= BLAST_R * 0.8 || p === hitEntity) { launch(p, hit, strength); loose++; got++; }
      }
      if (!got && nearest && nearestD <= BLAST_R) { launch(nearest, hit, strength); loose++; }
    } else {
      const w = part.whole;
      if (!isPickable(w)) continue;
      if (w === hitEntity || w.restPos.distanceTo(hit) - w.radius * 0.5 <= BLAST_R) { launch(w, hit, strength); loose++; }
    }
  }
  if (loose) onBreakFx(worldPoint, loose, strength);
  return loose;
}

function syncBrokenCount() {
  let n = 0;
  for (const e of entities) if (e.state === 'flying' || e.state === 'settled') n++;
  brokenCount = n;
}

function rebuildAll() {
  const list = entities.filter((e) => e.state === 'flying' || e.state === 'settled');
  if (!list.length) return;
  list.sort(() => Math.random() - 0.5);
  list.forEach((e, i) => {
    assembly.attach(e.mesh);
    e.fromPos.copy(e.mesh.position);
    e.fromQuat.copy(e.mesh.quaternion);
    e.t = -Math.min(i * 0.012, 0.45) - rnd(0, 0.08);
    e.dur = rnd(0.7, 1.05);
    e.state = 'returning';
  });
  syncBrokenCount();
  integrityDirty = true;
  onRebuildFx(list.length);
}

function partSettled(part) {
  if (!part.fractured) return;
  if (part.pieces.every((p) => p.state === 'rest')) {
    part.fractured = false;
    part.whole.mesh.visible = true;
    for (const p of part.pieces) p.mesh.visible = false;
  }
}

/** Intro: everything flies in from scatter. */
function scatterIn() {
  for (const e of entities) {
    if (e.kind === 'piece') continue;
    e.fromPos.copy(e.restPos).multiplyScalar(1.5).add(_v.set(rnd(-5, 5), rnd(-3, 5), rnd(6, 16)));
    e.fromQuat.setFromEuler(new THREE.Euler(rnd(-3, 3), rnd(-3, 3), rnd(-3, 3)));
    e.mesh.position.copy(e.fromPos);
    e.mesh.quaternion.copy(e.fromQuat);
    e.t = -(0.25 + (e.restPos.x + 5) * 0.045 + rnd(0, 0.25));
    e.dur = rnd(1.1, 1.5);

/* ───────────── per-frame physics ───────────── */
let landSoundBudget = 0;
function stepEntities(dt) {
  for (const e of entities) {
    const m = e.mesh;
    if (e.state === 'flying') {
      e.vel.y -= GRAV * dt;
      e.vel.multiplyScalar(1 - 0.18 * dt);
      m.position.addScaledVector(e.vel, dt);
      const w = e.ang.length();
      if (w > 1e-4) { _dq.setFromAxisAngle(_v.copy(e.ang).divideScalar(w), w * dt); m.quaternion.premultiply(_dq); }

      const r = clamp(e.radius * 0.3, 0.07, 0.35);
      if (m.position.y - r < FLOOR) {
        m.position.y = FLOOR + r;
        const impact = -e.vel.y;
        if (impact > 0) {
          e.vel.y = impact * 0.3;
          e.vel.x *= 0.78; e.vel.z *= 0.78;
          e.ang.multiplyScalar(0.55);
          if (impact > 2.5) onLandFx(m.position, impact, e.radius);
        }
        if (impact < 1.4 && e.vel.lengthSq() < 0.5) { e.state = 'settled'; e.vel.set(0, 0, 0); e.ang.set(0, 0, 0); }
      }
      if (Math.abs(m.position.x) > WALL_X) { m.position.x = Math.sign(m.position.x) * WALL_X; e.vel.x *= -0.4; }
      if (m.position.z > 7)  { m.position.z = 7;  e.vel.z *= -0.4; }
      if (m.position.z < -6) { m.position.z = -6; e.vel.z *= -0.4; }
    } else if (e.state === 'returning') {
      e.t += dt;
      if (e.t < 0) continue;
      const u = clamp(e.t / e.dur, 0, 1);
      const k = easeInOutCubic(u);
      m.position.lerpVectors(e.fromPos, e.restPos, k);
      m.position.z += Math.sin(Math.PI * u) * 0.9;       // little arc so parts don't clip through each other
      m.quaternion.slerpQuaternions(e.fromQuat, e.restQuat, easeOutQuart(u));

        m.quaternion.copy(e.restQuat);
        e.state = 'rest';
        integrityDirty = true;
        partSettled(e.part);
        fx.pulse = Math.min(fx.pulse + 0.05, 0.4);

}

/** 0–1 how much of the logo is still in place (area weighted). */
function computeIntegrity() {
  let sum = 0, tot = 0;
  for (const part of parts) {
    const weight = part.whole.radius * part.whole.radius;
    if (part.pieces.length) {
      let w = 0, a = 0;
      for (const p of part.pieces) { const r2 = p.radius * p.radius; w += r2; if (p.state === 'rest') a += r2; }
      const frac = part.fractured ? (w ? a / w : 1) : 1;
      sum += frac * weight;
      tot += weight;
    } else {
      sum += (part.whole.state === 'rest' ? 1 : 0) * weight;
      tot += weight;

/* ───────────── audio (synthesised, no files) ───────────── */
let actx = null, master = null, noiseBuf = null, soundOn = true, lastCrack = 0, lastTink = 0;

syncSoundBtn();

      noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.6, actx.sampleRate);

}

}

  const og = actx.createGain(); env(og, t, 0.38 * clamp(power, 0.3, 1.2), 0.003, 0.17);

}

  const g = actx.createGain(); env(g, t, clamp(v / 14, 0.02, 0.1), 0.001, rnd(0.04, 0.09));

function sndRebuild() {

  o.frequency.setValueAtTime(110, t); o.frequency.exponentialRampToValueAtTime(880, t + 0.85);
  const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(5000, t + 0.85);
  const g = actx.createGain(); env(g, t, 0.09, 0.2, 0.7);

  c.connect(cg); cg.connect(master); c.start(t + 0.95); c.stop(t + 1.4);

  if (!smashing && !cancelled) {
    const moved = Math.hypot(e.clientX - downX, e.clientY - downY), dt = performance.now() - downT;
    if (moved < 10 && dt < 350 && brokenCount > 0) rebuildAll();
  }
  smashing = false; controls.enabled = true; activeId = -1;
}
cv.addEventListener('pointerup', (e) => endPointer(e, false));
cv.addEventListener('pointercancel', (e) => endPointer(e, true));
controls.addEventListener('start', () => { userOrbiting = true; });
controls.addEventListener('end', () => { userOrbiting = false; });

btnRebuild.addEventListener('click', () => { ensureAudio(); rebuildAll(); });
btnSnd.addEventListener('click', () => {
  soundOn = !soundOn; syncSoundBtn(); if (soundOn) ensureAudio();
  try { localStorage.setItem('007-sound', soundOn ? 'on' : 'off'); } catch (e) {}
});
addEventListener('keydown', (e) => {
  if (e.repeat || e.metaKey || e.ctrlKey) return;
  if (e.key === 'r' || e.key === 'R') { rebuildAll(); }
  else if (e.key === 'm' || e.key === 'M') { btnSnd.click(); }
  else if (e.key === 'h' || e.key === 'H') { document.body.classList.toggle('hud-off'); }
});

/* ───────────── resize / adaptive quality ───────────── */
let resizeQueued = false;
function applySize() {
  resizeQueued = false;
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(quality);
  renderer.setSize(w, h);
  composer.setPixelRatio(quality);
  composer.setSize(w, h);
  applyResponsiveCamera(true);
}
function onResize() { if (!resizeQueued) { resizeQueued = true; requestAnimationFrame(applySize); } }
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 120));

let slowFrames = 0, lastDowngrade = 0;
function watchPerformance(rawDt, now) {
  if (document.hidden) return;
  slowFrames = rawDt > 0.034 ? slowFrames + 1 : Math.max(0, slowFrames - 2);
  if (slowFrames > 70 && quality > 1 && now - lastDowngrade > 2500) {
    quality = Math.max(1, quality * 0.8); slowFrames = 0; lastDowngrade = now; onResize();
  }
}

/* ───────────── main loop ───────────── */
const clock = new THREE.Clock();
let swayK = 1, time = 0, bloomBase = 0.12;
function frame() {
  requestAnimationFrame(frame);
  const rawDt = clock.getDelta();
  const dt = Math.min(rawDt, 0.05);
  time += dt;
  watchPerformance(rawDt, performance.now());

  // calm idle motion; fades out while orbiting, smashing, or rebuilding (and disabled under reduced-motion)
  const returning = entities.some((e) => e.state === 'returning');
  if (reduceMotion) {
    assembly.position.set(0, 0, 0);
    assembly.rotation.set(0, 0, 0);
    fx.shake = 0;
    fx.pulse = 0;
    bloom.strength = bloomBase;
  } else {
    swayK += (((userOrbiting || smashing || returning) ? 0 : 1) - swayK) * (1 - Math.pow(0.02, dt));
    const shake = fx.shake;
    assembly.position.set(rnd(-1, 1) * shake, Math.sin(time * 1.6) * 0.06 * swayK + rnd(-1, 1) * shake, 0);
    assembly.rotation.set(Math.cos(time * 1.3) * 0.012 * swayK, Math.sin(time * 0.42) * 0.24 * swayK, Math.sin(time) * 0.01 * swayK);
    fx.shake *= Math.pow(0.002, dt);
    fx.pulse *= Math.pow(0.03, dt);
    bloom.strength = bloomBase + fx.pulse;
  }

  // slow-drifting light for living reflections
  keyLight.position.x = 6 + Math.sin(time * 0.35) * 2.5;
  rimL.position.y = 6 + Math.sin(time * 0.5) * 2;

  stepEntities(dt);
  stepShards(dt);
  for (const r of rings) {
    if (r.t >= 1) { if (r.m.visible) r.m.visible = false; continue; }
    r.t = Math.min(1, r.t + dt / 0.55);
    const k = easeOutQuart(r.t);
    r.m.scale.setScalar(0.2 + k * r.max);
    r.m.material.opacity = (1 - r.t) * 0.55;
  }
  dust.rotation.y += dt * 0.012;
  dust.position.y = Math.sin(time * 0.2) * 0.2;

  if (integrityDirty) { integrityDirty = false; updateIntegrityUI(); }
  controls.update();
  composer.render();
}

/* ───────────── boot ───────────── */
try {
  await buildLogo();
} catch (err) {
  console.error(err);
  fatal('could not build the logo — see console');
}
if (!reduceMotion) scatterIn();
updateIntegrityUI();
elLoading.classList.add('hide');
setTimeout(() => { if (brokenCount === 0) elHint.classList.add('show'); }, reduceMotion ? 300 : 2600);
setTimeout(() => elHint.classList.remove('show'), 12000);
frame();

// tiny debug/test surface
window.__007 = { entities, parts, scene, camera, blastAt, rebuildAll, pick, computeIntegrity, stepEntities, get broken() { return brokenCount; }, fracturing: !!polyClip };
</script>
</body>
